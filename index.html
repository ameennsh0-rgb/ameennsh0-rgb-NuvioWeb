<!doctype html>
<html lang="en" class="no-flex-gap no-css-grid no-css-math no-backdrop-filter no-aspect-ratio">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <script src="assets/runtime/legacy-features.js"></script>
    <script>
      (function configureTizenLaunch() {
        var root = typeof globalThis !== "undefined" ? globalThis : window;
        var search = String((window.location && window.location.search) || "").toLowerCase();
        var userAgent = String(
          (window.navigator && window.navigator.userAgent) || ""
        ).toLowerCase();
        var webapis = root.webapis || {};
        var isTizenLaunch = Boolean(
          root.__NUVIO_PLATFORM__ === "tizen" ||
          root.tizen ||
          root.avplay ||
          webapis.avplay ||
          webapis.avPlay ||
          webapis.productinfo ||
          search.indexOf("wrapper=tizen") !== -1 ||
          userAgent.indexOf("tizen") !== -1
        );

        if (!isTizenLaunch) {
          return;
        }

        root.__NUVIO_PLATFORM__ = "tizen";
        var viewport = document.querySelector("meta[name='viewport']");
        if (!viewport) {
          viewport = document.createElement("meta");
          viewport.name = "viewport";
          document.head.appendChild(viewport);
        }
        viewport.setAttribute(
          "content",
          "width=1920, height=1080, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
        );
      })();
    </script>
    <script>
      /* Phone fit. The UI is laid out for a TV/desktop-sized viewport (fixed px).
         On a phone that renders everything huge and clipped, so give phones a
         virtual layout width the existing styles were designed for and let the
         browser scale it to the screen: ~1280px wide in landscape, ~720px in
         portrait. TVs, desktops and large tablets are left alone.
         Opt out with ?noscale (or localStorage nuvio.phoneScale = "off"). */
      (function phoneViewport() {
        try {
          var root = window;
          var ua = String((navigator && navigator.userAgent) || "");
          var search = String((location && location.search) || "").toLowerCase();
          if (search.indexOf("noscale") !== -1) return;
          try {
            if (localStorage.getItem("nuvio.phoneScale") === "off") return;
          } catch (e) {}
          if (root.__NUVIO_PLATFORM__ === "tizen" || root.tizen) return;
          if (/tizen|web0s|webos|smart-?tv|netcast|vidaa|hbbtv|aftb|crkey|bravia/i.test(ua)) return;
          var coarse = false;
          try {
            coarse = !!(window.matchMedia && window.matchMedia("(pointer: coarse)").matches);
          } catch (e) {}
          var shortSide = Math.min(screen.width || 0, screen.height || 0);
          var isMobileUa = /android|iphone|ipod|mobile/i.test(ua);
          // Phones only: coarse pointer, short side of the screen <= 600 CSS px.
          if (!coarse || !isMobileUa || !shortSide || shortSide > 600) return;

          // The page is loaded with width=device-width, so innerWidth/innerHeight
          // describe the real orientation at this moment (not later, when an
          // on-screen keyboard can shrink the height).
          var loadedLandscape = window.innerWidth > window.innerHeight;
          var rotated = false;
          function isLandscape() {
            try {
              if (screen.orientation && screen.orientation.type) {
                if (screen.orientation.type.indexOf("landscape") === 0) return true;
                if (rotated) return false;
              }
            } catch (e) {}
            if (typeof window.orientation === "number" && Math.abs(window.orientation) === 90) return true;
            if (screen.width > screen.height) return true;
            return !rotated && loadedLandscape;
          }
          function viewportContent() {
            // Width only: the browser fits this virtual width to the real screen,
            // so there is no scale math to get wrong on odd devices.
            return "width=" + (isLandscape() ? 1280 : 720) + ", user-scalable=no";
          }
          function apply() {
            var meta = document.querySelector("meta[name='viewport']");
            if (!meta) return;
            meta.setAttribute("content", viewportContent());
            document.documentElement.className += " phone-fit";
          }
          apply();
          function onRotate() {
            rotated = true;
            // Re-read after the browser has settled on the new orientation.
            setTimeout(function () {
              var meta = document.querySelector("meta[name='viewport']");
              if (meta) meta.setAttribute("content", viewportContent());
            }, 150);
          }
          window.addEventListener("orientationchange", onRotate);
          try {
            if (screen.orientation && screen.orientation.addEventListener) {
              screen.orientation.addEventListener("change", onRotate);
            }
          } catch (e) {}
        } catch (e) {}
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Nuvio TV</title>

    <link rel="stylesheet" href="css/base.css?v=20260509s" />
    <link rel="stylesheet" href="css/layout.css?v=20260509s" />
    <link rel="stylesheet" href="css/components.css?v=20260531supporters2" />
    <link rel="stylesheet" href="css/themes.css?v=20260509s" />
  </head>
  <body>
    <script src="boot-guard.js"></script>
    <!-- Tizen fast path: deferred scripts keep document order but no longer
         parser-block first paint / focus-engine init on single-core TVs. -->
    <script
      defer
      src="core-js.bundle.js"
      onerror="window.NuvioBootGuard && window.NuvioBootGuard.scriptFailed(this.src)"
    ></script>
    <script defer src="nuvio.env.js"></script>

    <script
      defer
      src="app.bundle.js?v=20260531supporters2"
      onerror="window.NuvioBootGuard && window.NuvioBootGuard.scriptFailed(this.src)"
    ></script>

    <!-- Pointer navigation bridge: lets a mouse drive this TV-focus UI.
         Hover moves focus, click selects (Enter), wheel scrolls rows,
         and a corner button / mouse back-button goes back (Escape). -->
    <script>
      (function pointerBridge() {
        try {
          if (window.matchMedia && window.matchMedia("(pointer: coarse)").matches) return;
        } catch (e) {}
        var FOCUSABLE = '.focusable,[data-focus-key],[tabindex]:not([tabindex="-1"])';
        var NATIVE = 'a[href],button,input,textarea,select,[role="button"],[contenteditable="true"],video';
        var lastHover = 0;
        function focusable(t) {
          return t && t.closest ? t.closest(FOCUSABLE) : null;
        }
        function sendKey(name, el) {
          var target = el || document.activeElement || document.body || document;
          try {
            target.dispatchEvent(new KeyboardEvent("keydown", { key: name, bubbles: true, cancelable: true }));
          } catch (e) {}
        }
        // Hover-to-focus and click-to-activate are handled by the app's built-in
        // pointer system (FocusEngine), enabled for the browser. This shim only
        // adds a mouse Back affordance and horizontal wheel scrolling for rows.
        document.addEventListener(
          "mouseup",
          function (e) {
            if (e.button === 3 || e.button === 4) {
              e.preventDefault();
              sendKey("Escape");
            }
          },
          true
        );
        document.addEventListener(
          "wheel",
          function (e) {
            var row =
              e.target.closest &&
              e.target.closest('[class*="row"],[class*="rail"],[class*="carousel"],[class*="shelf"]');
            if (row && row.scrollWidth > row.clientWidth + 4 && Math.abs(e.deltaY) >= Math.abs(e.deltaX)) {
              row.scrollLeft += e.deltaY;
            }
          },
          { passive: true }
        );
        function addBackButton() {
          if (document.getElementById("nuvio-pointer-back")) return;
          if (!document.body) return;
          var b = document.createElement("button");
          b.id = "nuvio-pointer-back";
          b.setAttribute("aria-label", "Back");
          b.textContent = "←";
          b.style.cssText =
            "position:fixed;left:12px;bottom:12px;z-index:99999;width:40px;height:40px;border:0;border-radius:50%;" +
            "background:rgba(0,0,0,.45);color:#fff;font-size:19px;cursor:pointer;opacity:.5;transition:opacity .15s;" +
            "display:flex;align-items:center;justify-content:center";
          b.onmouseenter = function () { b.style.opacity = "1"; };
          b.onmouseleave = function () { b.style.opacity = ".5"; };
          b.addEventListener("click", function (ev) {
            ev.stopPropagation();
            sendKey("Escape");
          });
          document.body.appendChild(b);
        }
        if (document.body) addBackButton();
        else document.addEventListener("DOMContentLoaded", addBackButton);
      })();
    </script>
  </body>
</html>
