name: Deploy Nuvio Web

# Builds the Nuvio web app and deploys it to Cloudflare as static assets:
# https://nuvio-web.<your-subdomain>.workers.dev
#
# Repository secrets used:
#   CLOUDFLARE_API_TOKEN            token allowed to edit Workers (same as the call server)
#   CLOUDFLARE_ACCOUNT_ID          your Cloudflare account ID
#   NUVIO_LOCAL_PROPERTIES_BASE64  app config (TMDB, Supabase...) — same secret as the Android build

on:
  push:
    branches: [video-call]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Write app config
        env:
          LP: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}
        run: |
          if [ -n "$LP" ]; then
            printf '%s' "$LP" | base64 -d > local.properties
            echo "Wrote local.properties from secret."
          else
            echo "::warning::NUVIO_LOCAL_PROPERTIES_BASE64 not set; building with example defaults (catalog and watch party may be limited)."
          fi

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets missing."
            exit 1
          fi
          for attempt in 1 2 3; do
            npx --yes wrangler@4 deploy 2>&1 | tee deploy.log && break
            sleep 30
          done
          url=$(grep -oE 'https://nuvio-web\.[A-Za-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "Live: $url"
          echo "### Live: $url" >> "$GITHUB_STEP_SUMMARY"
