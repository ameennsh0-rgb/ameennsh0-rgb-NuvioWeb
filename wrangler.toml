# Serves the built Nuvio web app (dist/) as static assets on Cloudflare, plus a
# small same-origin addon proxy (/__addon) for addons that don't send CORS.
name = "nuvio-web"
main = "worker/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
